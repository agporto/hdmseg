[workspace]
members = ["python"]
resolver = "2"

[package]
name = "hdmseg"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-2-Clause"
description = "Population-consistent spectral segmentation by correspondence-collapsed consensus diffusion"
authors = ["Arthur Porto <agporto@gmail.com>"]
readme = "README.md"
repository = "https://github.com/agporto/hdmseg"
homepage = "https://github.com/agporto/hdmseg"
keywords = ["segmentation", "diffusion-maps", "spectral-clustering", "morphometrics", "shape"]
categories = ["science", "algorithms", "mathematics"]
exclude = ["target/", "verify/"]

[features]
default = []
verification = []

[dependencies]
nalgebra = "0.34"
rayon = "1.11"
faer = "0.24.4"

[dev-dependencies]
approx = "0.5"

[[example]]
name = "verify_dump"
required-features = ["verification"]

[profile.release]
opt-level = 3
