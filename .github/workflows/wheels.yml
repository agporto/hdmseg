name: Wheels

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "python/**"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".github/workflows/wheels.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "python/**"
      - "CITATION.cff"
      - "CHANGELOG.md"
      - ".github/workflows/wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - platform: linux-aarch64
            runner: ubuntu-latest
            target: aarch64
          - platform: macos-universal2
            runner: macos-latest
            target: universal2-apple-darwin
          - platform: windows-x64
            runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          # abi3-py39: one wheel per platform covers every CPython >= 3.9.
          args: --release --out dist --manifest-path python/Cargo.toml
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path python/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  test:
    name: test (${{ matrix.platform }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and a current CPython on every OS; the same abi3
        # wheel serves both, which is exactly what this verifies. 3.9 on macOS
        # runs on the Intel runner (arm64 runners provide 3.10+ only); the
        # universal2 wheel covers both architectures.
        include:
          - { runner: ubuntu-latest, platform: linux-x86_64, python: "3.9" }
          - { runner: ubuntu-latest, platform: linux-x86_64, python: "3.13" }
          - { runner: macos-latest, platform: macos-universal2, python: "3.13" }
          - { runner: windows-latest, platform: windows-x64, python: "3.9" }
          - { runner: windows-latest, platform: windows-x64, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
      - name: Install wheel and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy
          python -m pip install --no-index --find-links dist hdmseg
          python -m pytest python/tests -q

  tag-tested-release:
    name: Tag tested version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- Cargo.lock
            VERSION="$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as stream:
              print(tomllib.load(stream)['package']['version'])
          PY
          )"
            git commit -m "Sync Cargo.lock for v${VERSION}"
            git push origin HEAD:main
          fi
      - name: Verify release metadata and create tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          with open('Cargo.toml', 'rb') as stream:
              print(tomllib.load(stream)['package']['version'])
          PY
          )"
          TAG="v${VERSION}"
          python - "$VERSION" <<'PY'
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = sys.argv[1]
          with Path('python/Cargo.toml').open('rb') as stream:
              binding_version = tomllib.load(stream)['package']['version']
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          lockfile = Path('Cargo.lock').read_text(encoding='utf-8')
          citation_match = re.search(r'(?m)^version:\s*([0-9.]+)\s*$', citation)

          errors = []
          if binding_version != version:
              errors.append(
                  f'python/Cargo.toml is {binding_version}, expected {version}'
              )
          if citation_match is None or citation_match.group(1) != version:
              errors.append('CITATION.cff version does not match Cargo.toml')
          if f'## [{version}]' not in changelog:
              errors.append(f'CHANGELOG.md has no release section for {version}')
          for package in ('hdmseg', 'hdmseg-python'):
              marker = f'[[package]]\nname = "{package}"\nversion = "{version}"'
              if marker not in lockfile:
                  errors.append(f'Cargo.lock version is stale for {package}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'release metadata verified for v{version}')
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "${TAG} already exists; no release tag created."
            exit 0
          fi
          git tag -a "$TAG" -m "hdmseg ${VERSION}"
          git push origin "$TAG"

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hdmseg
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and release metadata
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          with Path('Cargo.toml').open('rb') as stream:
              version = tomllib.load(stream)['package']['version']
          with Path('python/Cargo.toml').open('rb') as stream:
              binding_version = tomllib.load(stream)['package']['version']
          tag = os.environ['GITHUB_REF_NAME']
          citation = Path('CITATION.cff').read_text(encoding='utf-8')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          lockfile = Path('Cargo.lock').read_text(encoding='utf-8')
          citation_match = re.search(r'(?m)^version:\s*([0-9.]+)\s*$', citation)

          errors = []
          if tag != f'v{version}':
              errors.append(f'tag {tag!r} does not match Cargo version v{version}')
          if binding_version != version:
              errors.append(
                  f'python/Cargo.toml is {binding_version}, expected {version}'
              )
          if citation_match is None or citation_match.group(1) != version:
              errors.append('CITATION.cff version does not match Cargo.toml')
          if f'## [{version}]' not in changelog:
              errors.append(f'CHANGELOG.md has no release section for {version}')
          for package in ('hdmseg', 'hdmseg-python'):
              marker = f'[[package]]\nname = "{package}"\nversion = "{version}"'
              if marker not in lockfile:
                  errors.append(f'Cargo.lock version is stale for {package}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'release metadata verified for {tag}')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
