[package]
name = "hdmseg-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "BSD-2-Clause"
description = "Python bindings for the hdmseg segmentation library"
repository = "https://github.com/agporto/hdmseg"
homepage = "https://github.com/agporto/hdmseg"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
hdmseg = { path = ".." }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
numpy = "0.29"
nalgebra = "0.34"

[features]
default = []
# Enabled by maturin at wheel-build time (see pyproject.toml); kept out of
# `default` so plain `cargo check`/`clippy` link cleanly outside a Python
# build environment.
extension-module = ["pyo3/extension-module"]
